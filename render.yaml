# ==============================================================================
# SahayakAI — Render Production Deployment Blueprint
# ==============================================================================

services:
  - type: web
    name: sahayakai-backend
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: SahayakAI
      - key: DEFAULT_AI_PROVIDER
        value: demo
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: sahayakai-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: sahayakai-storage
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: sahayakai-db
    plan: starter
    region: oregon
    databaseName: sahayakai
    user: sahayak_user
